name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEOMAN_DIR: ${{ github.workspace }}/maplibre-geoman-android/app
    steps:
      - uses: actions/checkout@v4

      - name: Checkout maplibre-geoman-android
        uses: actions/checkout@v4
        with:
          repository: Zuhir-Benslama/maplibre-geoman-android
          ref: main
          path: maplibre-geoman-android

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          if [ ! -f local.properties ]; then
            if [ -f local.properties.example ]; then
              cp local.properties.example local.properties
            else
              echo "# Auto-generated for CI" > local.properties
            fi
          fi

      - name: Check formatting (Spotless/ktlint)
        run: ./gradlew spotlessCheck

      - name: Static analysis (Detekt)
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew :app:lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate coverage report
        run: ./gradlew :app:jacocoTestReport

      - name: Enforce coverage gate
        run: python3 .github/scripts/check_coverage.py app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml 30

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  connected-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEOMAN_DIR: ${{ github.workspace }}/maplibre-geoman-android/app
    steps:
      - uses: actions/checkout@v4

      - name: Checkout maplibre-geoman-android
        uses: actions/checkout@v4
        with:
          repository: Zuhir-Benslama/maplibre-geoman-android
          ref: main
          path: maplibre-geoman-android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          if [ ! -f local.properties ]; then
            if [ -f local.properties.example ]; then
              cp local.properties.example local.properties
            else
              echo "# Auto-generated for CI" > local.properties
            fi
          fi

      - name: Run connected tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb shell input keyevent 82
            sleep 10
            bash -c 'for attempt in 1 2 3; do ./gradlew connectedDebugAndroidTest --no-daemon && echo "Connected tests passed." && exit 0; echo "Attempt $attempt failed; waiting 30s before retry..."; sleep 30; done; echo "All connected test attempts failed."; exit 1'

      - name: Upload connected test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: app/build/reports/androidTests/
