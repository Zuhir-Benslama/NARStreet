name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
  GEOMAN_DIR: ${{ github.workspace }}/maplibre-geoman-android/app

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Check formatting (Spotless/ktlint)
        run: ./gradlew spotlessCheck

      - name: Static analysis (Detekt)
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew :app:lint

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Generate coverage report
        run: ./gradlew :app:jacocoTestReport

      - name: Enforce coverage gate
        run: python3 .github/scripts/check_coverage.py app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml 30

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  connected-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Run connected tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          script: |
            adb shell input keyevent 82
            sleep 10
            adb shell settings put secure show_ime_with_hard_keyboard 0
            IME_ID=$(adb shell ime list -s | head -n1)
            if [ -n "$IME_ID" ]; then adb shell ime disable "$IME_ID" || true; fi
            bash -c 'for attempt in 1 2 3; do ./gradlew :app:connectedDebugAndroidTest --no-daemon && echo "Connected tests passed." && exit 0; echo "Attempt $attempt failed; waiting 30s before retry..."; adb logcat -d > connected-test-logcat.txt; sleep 30; done; echo "All connected test attempts failed."; exit 1'

      - name: Upload connected test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-report
          path: |
            app/build/reports/androidTests/
            connected-test-logcat.txt
