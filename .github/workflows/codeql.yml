name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      GEOMAN_DIR: ${{ github.workspace }}/maplibre-geoman-android/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout maplibre-geoman-android
        uses: actions/checkout@v4
        with:
          repository: Zuhir-Benslama/maplibre-geoman-android
          ref: ca53d5c6c21eddc0ffe27a0337cc0cce4aab885e
          path: maplibre-geoman-android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          if [ ! -f local.properties ]; then
            if [ -f local.properties.example ]; then
              cp local.properties.example local.properties
            else
              echo "# Auto-generated for CI" > local.properties
            fi
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
